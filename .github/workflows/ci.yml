name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} (${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build targets
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run CTest
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Download Godot Engine (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.4-stable/Godot_v4.4-stable_linux.x86_64.zip
          unzip -q Godot_v4.4-stable_linux.x86_64.zip
          sudo mv Godot_v4.4-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Run Godot Smoke Test with Fresh Extension
        if: matrix.os == 'ubuntu-latest' && matrix.build_type == 'Release'
        run: godot --headless --path godot --script scripts/smoke_test_profile.gd
